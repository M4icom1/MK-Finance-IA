<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a"><title>MK Finance IA</title>
<style>
:root{--bg:#07080a;--card:#12141a;--c2:#1a1d25;--bd:#242832;--fg:#eef0f3;--mut:#8b919c;--ac:#3ddc97;--bad:#ff6b6b;--warn:#ffb454;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(800px 420px at 85% -8%,#0e2b20,transparent 60%),var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
.w{max-width:820px;margin:0 auto;padding:12px 12px 100px}
.cv{width:100%;border-radius:16px;display:block;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}.top b{font-size:19px}.top b i{color:var(--ac);font-style:normal}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{grid-column:1/3;background:linear-gradient(135deg,#123326,var(--card))!important}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.l{font-size:12px;color:var(--mut);margin-bottom:2px}.v{font-size:22px;font-weight:650}.big .v{font-size:32px}.pos{color:var(--ac)}.neg{color:var(--bad)}
.mb{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:10px;font-weight:600;text-transform:capitalize}
input,select{font:inherit;padding:11px;border-radius:12px;border:1px solid var(--bd);background:#0d0f13;color:var(--fg);min-width:0;width:100%}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:#06130d;font-weight:650;cursor:pointer;transition:transform .12s,opacity .12s}button:active{transform:scale(.96)}
button.s{background:var(--c2);color:var(--mut);padding:6px 12px;font-weight:500}button.full{width:100%;margin-top:8px}
.r,.r2{display:flex;gap:8px;margin-top:8px}.r2>*{flex:1}.r:first-child{margin-top:0}
.seg{display:flex;background:#0d0f13;border-radius:12px;padding:3px}.seg button{flex:1;background:none;color:var(--mut)}.seg button.on{background:var(--ac);color:#06130d}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}.dw{position:relative;width:170px;height:170px;margin:auto}.dw svg{transform:rotate(-90deg)}.dw circle{transition:stroke-width .2s}
.ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.ct .v{font-size:17px}
#leg{flex:1;min-width:180px}.lg{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:10px;cursor:pointer;font-size:14px}.lg:hover,.lg.on{background:var(--c2)}.lg i{width:10px;height:10px;border-radius:50%}.lg span:nth-child(3){margin-left:auto}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:10px}.col{flex:1;text-align:center;cursor:pointer}.pr{display:flex;gap:3px;align-items:flex-end;height:100px;justify-content:center}.pr i{width:40%;border-radius:5px 5px 0 0;min-height:2px;transition:height .5s}.col small{font-size:11px;color:var(--mut)}.col.on small{color:var(--ac);font-weight:700}
.bd{margin:10px 0}.bd .t{display:flex;justify-content:space-between;font-size:14px}.bd .tr{height:8px;background:var(--c2);border-radius:5px;margin-top:5px;overflow:hidden}.bd .tr i{display:block;height:100%;border-radius:5px;transition:width .5s}
.t{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.t:last-child{border:0}.t .ic{width:36px;height:36px;border-radius:11px;background:var(--c2);display:grid;place-items:center}.t .tx{flex:1;min-width:0}.t .tx div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t small{color:var(--mut)}
#chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;margin:8px 0}.m{padding:9px 12px;border-radius:14px;background:var(--c2);max-width:88%;white-space:pre-wrap}.m.me{align-self:flex-end;background:var(--ac);color:#06130d}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:var(--c2);color:var(--fg);font-weight:400;font-size:13px;padding:6px 11px;border-radius:999px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(9,10,13,.92);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.tabs button{flex:1;max-width:190px;background:none;color:var(--mut);font-weight:500;font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:center;padding:6px}.tabs button span{font-size:19px}.tabs button.on{color:var(--ac);background:#10261d}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#222730;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;font-size:14px}#toast.on{opacity:1;transform:translate(-50%,0)}
#login{max-width:380px;margin:10vh auto}#login input{margin-bottom:8px}.hint{color:var(--mut);font-size:13px}[hidden]{display:none!important}
</style></head><body>
<div class="w" id="login" hidden><img class="cv" src="cover.svg" alt="MK Finance IA"><input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button id="go" class="full">Entrar</button><p class="hint" id="err"></p></div>
<div id="app" hidden><div class="w">
<div class="top"><div><b>MK Finance <i>IA</i></b><div class="l" id="hi"></div></div><button class="s" id="out">Sair</button></div>
<div class="mb" id="mbar"><button class="s" id="mp">◀</button><span id="ml"></span><button class="s" id="mn">▶</button></div>
<section id="t-home">
<div class="g"><div class="c big"><div class="l">Saldo do mês (entradas − gastos)</div><div class="v" id="v-saldo">–</div></div>
<div class="c"><div class="l">Gastos</div><div class="v neg" id="v-g">–</div></div><div class="c"><div class="l">Entradas</div><div class="v pos" id="v-e">–</div></div>
<div class="c"><div class="l">Fatura do cartão</div><div class="v" id="v-f">–</div></div><div class="c"><div class="l">Reserva cobre</div><div class="v" id="v-r">–</div></div></div>
<div class="c"><div class="l">Gastos por categoria (toque para destacar)</div><div class="dn"><div class="dw"><svg id="donut" viewBox="0 0 42 42"></svg><div class="ct"><div class="l" id="dc-l"></div><div class="v" id="dc-v"></div></div></div><div id="leg"></div></div></div>
<div class="c"><div class="l">Últimos 6 meses (toque numa coluna)</div><div class="bars" id="bars"></div></div>
<div class="c"><div class="l">Limites por categoria</div><div id="bud"></div></div></section>
<section id="t-tx" hidden>
<div class="c"><div class="seg"><button data-tp="gasto" class="on">Gasto</button><button data-tp="entrada">Entrada</button></div>
<div class="r2"><input id="f-v" inputmode="decimal" placeholder="Valor (ex.: 25,90)"><input id="f-d" type="date"></div>
<div class="r2"><select id="f-c"></select><input id="f-t" placeholder="Descrição"></div><button id="f-add" class="full">Adicionar</button></div>
<div class="c"><div class="r"><input id="q" placeholder="Buscar lançamentos…"><button class="s" id="csv">CSV</button></div><div id="list"></div></div></section>
<section id="t-ai" hidden><div class="c"><div class="chips" id="chips"></div><div id="chat"></div><div class="r"><input id="inp" placeholder="Ex.: gastei 150 no mercado" autocomplete="off"><button id="send">Enviar</button></div></div></section>
<section id="t-plan" hidden>
<div class="c"><div class="l">Seu perfil</div><div class="r2"><input id="p-n" placeholder="Seu nome"></div><div class="r2"><input id="p-r" inputmode="decimal" placeholder="Renda mensal (R$)"><input id="p-s" inputmode="decimal" placeholder="Reserva atual (R$)"></div></div>
<div class="c"><div class="l">Faturas do cartão por mês</div><div id="fat"></div><button class="s" id="fat-add" style="margin-top:8px">+ adicionar mês</button></div>
<div class="c"><div class="l">Limite mensal por categoria (vazio = sem limite)</div><div id="lim"></div></div>
<button class="full" id="p-save">Salvar plano</button></section>
</div>
<nav class="tabs"><button data-t="home" class="on"><span>📊</span>Início</button><button data-t="tx"><span>🧾</span>Lançamentos</button><button data-t="ai"><span>🤖</span>Assistente</button><button data-t="plan"><span>🎯</span>Plano</button></nav>
<div id="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
